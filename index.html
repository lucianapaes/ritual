const toKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,(m??1)-1,d??1)};
const todayKey=()=>toKey(new Date());
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return toKey(d)};
const diffDays=(a,b)=>Math.round((fromKey(b)-fromKey(a))/86400000);

function getDayType(key,anchor,colorDates=[]){
  if(colorDates.includes(key))return"color";
  if(!anchor)return"wash";
  return(((diffDays(anchor,key)%2)+2)%2)===0?"wash":"recovery";
}
function isPreColor(key,anchor,cd){return getDayType(addDays(key,1),anchor,cd)==="color"}
function getFocus(key,anchor){
  if(!anchor)return"reco";
  return Math.floor((((diffDays(anchor,key)%14)+14)%14)/7)===0?"reco":"hidro";
}

function Ring({value,total,size=44,color="rgba(255,255,255,.9)"}){
  const s=2.5,r=(size-s)/2,c=2*Math.PI*r,p=total>0?Math.min(1,value/total):0;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={s} stroke={`${color}28`}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={s} strokeLinecap="round"
          stroke={color} strokeDasharray={c} strokeDashoffset={c*(1-p)} style={{transition:"stroke-dashoffset .6s ease-out"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color,fontVariantNumeric:"tabular-nums",fontWeight:500}}>{value}/{total}</div>
    </div>
  );
}

function TimerSheet({open,title,minutes,type,onClose}){
  const tot=minutes*60;
  const[left,setLeft]=useState(tot);
  const[run,setRun]=useState(false);
  const[done,setDone]=useState(false);
  useEffect(()=>{if(!open)return;setLeft(tot);setRun(false);setDone(false)},[open,tot]);
  useEffect(()=>{
    if(!open||!run)return;
    const id=setInterval(()=>setLeft(v=>{
      if(v<=1){clearInterval(id);setRun(false);setDone(true);navigator.vibrate?.([150,80,250]);return 0}
      return v-1;
    }),1000);
    return()=>clearInterval(id);
  },[open,run]);
  if(!open)return null;
  const sz=168,r2=(sz-7)/2,circ=2*Math.PI*r2,pct=tot>0?left/tot:0;
  const mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
  const th=T[type]||T.wash;
  return(
    <div style={{position:"fixed",inset:0,zIndex:70,display:"flex",alignItems:"flex-end"}}>
      <div onClick={onClose} style={{position:"absolute",inset:0,background:"rgba(28,25,20,.55)",backdropFilter:"blur(6px)"}}/>
      <div style={{position:"relative",width:"100%",borderRadius:"22px 22px 0 0",background:"var(--bg)",borderTop:"1px solid var(--border)",
        padding:`18px var(--px) calc(var(--px) + var(--sab))`,animation:"rise .3s cubic-bezier(.22,1,.36,1) both"}}>
        <div style={{width:32,height:3,borderRadius:2,background:"var(--border2)",margin:"0 auto 22px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
          <div>
            <div style={{fontSize:11,letterSpacing:".2em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:5,fontWeight:500}}>Temporizador</div>
            <div style={{fontSize:19,fontFamily:FP,color:"var(--ink)"}}>{title}</div>
          </div>
          <button onClick={onClose} style={{border:"1px solid var(--border)",borderRadius:"50%",width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",background:"none",cursor:"pointer",color:"var(--ink3)",fontSize:20,lineHeight:1}}>×</button>
        </div>
        <div style={{position:"relative",width:sz,height:sz,margin:"0 auto 26px"}}>
          <svg width={sz} height={sz} style={{transform:"rotate(-90deg)"}}>
            <circle cx={sz/2} cy={sz/2} r={r2} fill="none" strokeWidth={6} stroke="var(--bg2)"/>
            <circle cx={sz/2} cy={sz/2} r={r2} fill="none" strokeWidth={6} strokeLinecap="round"
              stroke={th.stroke} strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} style={{transition:"stroke-dashoffset 1s linear"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontFamily:FP,fontSize:46,letterSpacing:"-.04em",fontVariantNumeric:"tabular-nums",color:"var(--ink)"}}>{mm}:{ss}</span>
            <span style={{fontSize:11,color:"var(--ink3)",marginTop:3}}>{done?"concluído":run?"em andamento":"pausado"}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>done?onClose():setRun(r=>!r)}
            style={{flex:1,padding:"15px 0",borderRadius:40,border:"none",cursor:"pointer",fontSize:14,background:"var(--ink)",color:"var(--bg)",fontWeight:500}}>
            {done?"Pronto":run?"Pausar":"Iniciar"}
          </button>
          <button onClick={onClose} style={{padding:"15px 20px",borderRadius:40,border:"1px solid var(--border)",background:"none",cursor:"pointer",fontSize:14,color:"var(--ink2)"}}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

];

function Quiz({onDone}){
  const[step,setStep]=useState(0);
  const[ans,setAns]=useState({});
  const q=QS[step];
  const cur=ans[q.id];
  const ok=q.multi?(cur&&cur.length>0):(cur!=null);
  const toggle=v=>{
    if(q.multi){const c=ans[q.id]||[];setAns(a=>({...a,[q.id]:c.includes(v)?c.filter(x=>x!==v):[...c,v]}))}
    else setAns(a=>({...a,[q.id]:v}));
  };
  const active=v=>q.multi?(ans[q.id]||[]).includes(v):ans[q.id]===v;
  const next=()=>{if(step<QS.length-1)setStep(s=>s+1);else onDone(ans)};
  return(
    <div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",background:"var(--bg)",fontFamily:FI,
      paddingTop:"calc(var(--sat) + 36px)",paddingBottom:"calc(var(--sab) + 28px)",
      paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))"}}>
      <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",fontWeight:500,marginBottom:22}}>Perfil · {step+1}</div>
      <h1 style={{fontFamily:FP,fontSize:"clamp(1.9rem,7.5vw,2.7rem)",lineHeight:1.02,letterSpacing:"-.025em",color:"var(--ink)",marginBottom:q.sub?10:28}}>{q.q}</h1>
      {q.sub&&<p style={{fontSize:14,color:"var(--ink3)",marginBottom:26,lineHeight:1.5}}>{q.sub}</p>}
      <div style={{display:"flex",flexDirection:"column",gap:8,flex:1}}>
        {q.opts.map(o=>{
          const on=active(o.v);
          return(
            <button key={o.v} onClick={()=>toggle(o.v)}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",textAlign:"left",padding:"18px 20px",borderRadius:14,cursor:"pointer",transition:"all .15s",
                border:`1px solid ${on?"#6a9a75":"var(--border)"}`,background:on?"rgba(74,124,89,.07)":"transparent"}}>
              <span style={{fontSize:17,color:"var(--ink)",fontWeight:on?500:400}}>{o.l}</span>
              {o.h&&<span style={{fontSize:12,color:"var(--ink3)",marginLeft:12,flexShrink:0}}>{o.h}</span>}
            </button>
          );
        })}
      </div>
      <div style={{display:"flex",gap:10,marginTop:24}}>
        {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{padding:"15px 20px",borderRadius:40,border:"1px solid var(--border)",background:"none",cursor:"pointer",fontSize:15,color:"var(--ink2)"}}>←</button>}
        <button onClick={next} disabled={!ok}
          style={{flex:1,padding:"15px 0",borderRadius:40,border:"none",cursor:ok?"pointer":"not-allowed",fontSize:15,fontWeight:500,
            background:ok?"#3d6b4a":"var(--bg2)",color:ok?"#f0ede6":"var(--ink3)",transition:"all .2s"}}>
          {step<QS.length-1?"Continuar →":"Salvar perfil →"}
        </button>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:18}}>
        {QS.map((_,i)=><div key={i} style={{width:i===step?18:5,height:4,borderRadius:2,background:i===step?"#3d6b4a":i<step?"#6a9a75":"var(--border)",transition:"all .3s"}}/>)}
      </div>
    </div>
  );
}

function ShelfSheet({open,onClose,products,onSave}){

    if(form.id)setList(l=>l.map(p=>p.id===form.id?{...p,...form}:p));
    else setList(l=>[...l,{...form,id:Math.random().toString(36).slice(2,9),addedAt:new Date().toISOString()}]);

              onChange={e=>setForm(f=>({...f,benefits:e.target.value}))}

        </div>
      </div>
      <div style={{padding:"28px var(--px) 0",paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))"}}>

        <section style={{marginBottom:28}}>
          <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:8,fontWeight:500}}>Perfil</div>
          <div style={{background:"#faf8f4",borderRadius:14,border:"1px solid var(--border)",padding:"16px",marginBottom:10}}>
            {[["Tipo",p.hairType],["Porosidade",p.porosity],["Química",(Array.isArray(p.chemistry)?p.chemistry:[]).map(c=>chem[c]||c).join(", ")],["Objetivo",goal[p.goal]||p.goal]].map(([k,v])=>v?(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
                <span style={{fontSize:13,color:"var(--ink3)"}}>{k}</span>
                <span style={{fontSize:13,color:"var(--ink)",textTransform:"capitalize"}}>{v}</span>
              </div>
            ):null)}
          </div>
          <button onClick={onResetQuiz} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"1px solid var(--border)",background:"none",cursor:"pointer",fontSize:13,color:"var(--ink2)"}}>Refazer quiz de perfil</button>
        </section>

        <section style={{marginBottom:28}}>
          <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:8,fontWeight:500}}>Ciclo de lavagem</div>
          <Lbl c="Última lavagem (âncora do ciclo)"/>
          <p style={{fontSize:12,color:"var(--ink3)",marginBottom:10,lineHeight:1.5}}>O app alterna lavagem/manutenção a partir desta data. Use "lavei hoje" para reajustar sem abrir configurações.</p>
          <input type="date" value={anchor} onChange={e=>setAnchor(e.target.value)} style={INP}/>
        </section>

        <section style={{marginBottom:28}}>
          <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:8,fontWeight:500}}>Dias de coloração</div>
          <p style={{fontSize:12,color:"var(--ink3)",marginBottom:12,lineHeight:1.5}}>A lavagem anterior recebe aviso automático para usar o acidificante.</p>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={{...INP,flex:1}}/>
            <button onClick={addDate} disabled={!newDate}
              style={{padding:"13px 18px",borderRadius:12,background:newDate?"var(--ink)":"var(--bg2)",color:newDate?"var(--bg)":"var(--ink3)",border:"none",cursor:newDate?"pointer":"not-allowed",fontSize:16}}>+</button>
          </div>
          {colorDates.length===0&&<p style={{fontSize:13,color:"var(--ink3)"}}>Nenhuma data adicionada.</p>}
          {colorDates.map(d=>(
            <div key={d} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderRadius:10,background:"#faf8f4",border:"1px solid var(--border)",marginBottom:7}}>
              <span style={{fontSize:14,color:"var(--ink)"}}>{fromKey(d).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</span>
              <button onClick={()=>setColorDates(ds=>ds.filter(x=>x!==d))} style={{border:"none",background:"none",cursor:"pointer",color:"var(--ink3)",fontSize:22,lineHeight:1}}>×</button>
            </div>
          ))}
        </section>

        <section>
          <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:8,fontWeight:500}}>Dados</div>
          <button onClick={()=>{
            const data=JSON.stringify(JSON.parse(localStorage.getItem(SK)||"{}"),null,2);
            const el=document.createElement("a");
            el.href="data:application/json;charset=utf-8,"+encodeURIComponent(data);
            el.download="ritual-backup.json";
            el.click();
          }} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"1px solid var(--border)",background:"none",cursor:"pointer",fontSize:13,color:"var(--ink2)",marginBottom:10}}>
            ↓ Exportar dados (backup)
          </button>
          <label style={{display:"block",width:"100%",padding:"12px 0",borderRadius:12,border:"1px solid var(--border)",background:"none",cursor:"pointer",fontSize:13,color:"var(--ink2)",textAlign:"center"}}>
            ↑ Importar dados
            <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{
              const file=e.target.files[0]; if(!file)return;
              const reader=new FileReader();
              reader.onload=ev=>{
                try{
                  const data=JSON.parse(ev.target.result);
                  localStorage.setItem(SK,JSON.stringify(data));
                  alert("Dados importados. Reabra o app.");
                }catch{alert("Arquivo inválido.")}
              };
              reader.readAsText(file);
            }}/>
          </label>
        </section>
      </div>
    </div>
  );
}

/* ── HOME ── */
function Home({state,onRoutine,onWashed,onSkip,onSettings,onShelf}){
  const today=todayKey();
  const skipped=(state.skipped||[]).includes(today);
  const type=skipped?"recovery":getDayType(today,state.anchor,state.colorDates);
  const focus=getFocus(today,state.anchor);
  const steps=buildSteps(type,focus,state.sel);
  const done=(state.progress[today]||[]).filter(id=>steps.some(s=>s.id===id)).length;
  const precolor=type!=="color"&&isPreColor(today,state.anchor,state.colorDates);
  const th=T[type];
  const days=Array.from({length:14},(_,i)=>{
    const k=addDays(today,i);
    const sk=(state.skipped||[]).includes(k);
    return{key:k,date:fromKey(k),type:sk?"recovery":getDayType(k,state.anchor,state.colorDates)};
  });
  return(
    <div style={{minHeight:"100dvh",background:"var(--bg)",fontFamily:FI}}>
      <Hero type={type}>
        <div style={{minHeight:"68dvh",display:"flex",flexDirection:"column",
          paddingTop:"calc(var(--sat) + 20px)",paddingBottom:44,
          paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:11,letterSpacing:".24em",textTransform:"uppercase",color:"rgba(240,237,230,.5)",fontWeight:500}}>Ritual</span>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <button onClick={onShelf} style={{padding:"7px 14px",borderRadius:40,background:"rgba(240,237,230,.1)",border:"1px solid rgba(240,237,230,.2)",cursor:"pointer",color:"rgba(240,237,230,.8)",fontSize:12}}>prateleira</button>
              <button onClick={onSettings} style={{width:32,height:32,borderRadius:"50%",background:"rgba(240,237,230,.1)",border:"1px solid rgba(240,237,230,.2)",cursor:"pointer",color:"rgba(240,237,230,.8)",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>⚙</button>
              <Ring value={done} total={steps.length}/>
            </div>
          </div>
          <div style={{marginTop:"auto"}}>
            {precolor&&<div style={{display:"inline-block",padding:"7px 14px",borderRadius:20,background:"rgba(0,0,0,.3)",backdropFilter:"blur(6px)",fontSize:12,color:"rgba(240,237,230,.85)",marginBottom:16,lineHeight:1.4}}>
              ⚠ amanhã é coloração — acidificante ao final do banho
            </div>}
            <p style={{fontSize:12,color:"rgba(240,237,230,.45)",marginBottom:10,letterSpacing:".04em"}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</p>
            <h1 style={{fontFamily:FP,fontSize:"clamp(3rem,13vw,4.2rem)",lineHeight:.92,letterSpacing:"-.03em",color:th.fg,marginBottom:14}}>{th.label}</h1>
            <p style={{fontSize:14,color:"rgba(240,237,230,.55)",maxWidth:280,lineHeight:1.55,marginBottom:24}}>{th.sub}</p>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={()=>onRoutine(today)} style={{padding:"11px 22px",borderRadius:40,background:"rgba(240,237,230,.12)",border:"1px solid rgba(240,237,230,.25)",cursor:"pointer",fontSize:14,color:th.fg,backdropFilter:"blur(6px)"}}>Ver rotina →</button>
              <button onClick={onWashed} style={{padding:"11px 18px",borderRadius:40,background:"rgba(240,237,230,.08)",border:"1px solid rgba(240,237,230,.18)",cursor:"pointer",fontSize:13,color:"rgba(240,237,230,.7)"}}>✓ lavei hoje</button>
              {type==="wash"&&!skipped&&<button onClick={onSkip} style={{padding:"11px 16px",borderRadius:40,background:"transparent",border:"1px solid rgba(240,237,230,.12)",cursor:"pointer",fontSize:13,color:"rgba(240,237,230,.4)"}}>pular</button>}
            </div>
          </div>
        </div>
      </Hero>
      <section style={{paddingTop:22,paddingBottom:8}}>
        <div style={{fontSize:10,letterSpacing:".2em",textTransform:"uppercase",color:"var(--ink3)",paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))",marginBottom:12,fontWeight:500}}>Próximos 14 dias</div>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))",paddingBottom:4}}>
          {days.map((d,i)=>{
            const th2=T[d.type]||T.wash;
            return(
              <button key={d.key} onClick={()=>onRoutine(d.key)}
                style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:6,minWidth:52,padding:"13px 8px",borderRadius:16,
                  border:`1px solid ${i===0?"var(--ink2)":"var(--border)"}`,background:i===0?"var(--bg2)":"transparent",cursor:"pointer"}}>
                <span style={{fontSize:9,textTransform:"uppercase",letterSpacing:".14em",color:"var(--ink3)",fontWeight:500}}>{d.date.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","").slice(0,3)}</span>
                <span style={{fontFamily:FP,fontSize:18,color:"var(--ink)",lineHeight:1}}>{d.date.getDate()}</span>
                <span style={{width:16,height:3,borderRadius:2,background:th2.dot}}/>
              </button>
            );
          })}
        </div>
        <div style={{display:"flex",gap:18,paddingLeft:"calc(var(--sal) + var(--px))",paddingTop:10,fontSize:10,color:"var(--ink3)",fontWeight:500}}>
          {[["wash","Lavagem"],["recovery","Manutenção"],["color","Coloração"]].map(([t,l])=>(
            <span key={t} style={{display:"inline-flex",alignItems:"center",gap:5}}>
              <span style={{width:12,height:3,borderRadius:2,background:T[t].dot,display:"inline-block"}}/>{l}
            </span>
          ))}
        </div>
      </section>
      <div style={{height:"calc(24px + var(--sab))"}}/>
    </div>
  );
}

/* ── ROUTINE ── */
function Routine({state,dispatch,dateKey,onBack,onNavDay}){
  const[timer,setTimer]=useState(null);
  const[picker,setPicker]=useState(null);
  const touchX=useRef(null);
  const skipped=(state.skipped||[]).includes(dateKey);
  const type=skipped?"recovery":getDayType(dateKey,state.anchor,state.colorDates);
  const focus=getFocus(dateKey,state.anchor);
  const steps=buildSteps(type,focus,state.sel);
  const doneIds=state.progress[dateKey]||[];
  const done=doneIds.filter(id=>steps.some(s=>s.id===id)).length;
  const isToday=dateKey===todayKey();
  const precolor=type!=="color"&&isPreColor(dateKey,state.anchor,state.colorDates);
  const th=T[type]||T.wash;
  const onTS=e=>touchX.current=e.touches[0].clientX;
  const onTE=e=>{if(touchX.current===null)return;const dx=e.changedTouches[0].clientX-touchX.current;if(Math.abs(dx)>55)onNavDay(dx<0?1:-1);touchX.current=null};
  const getProd=slot=>{const pid=state.sel?.[slot];return pid?state.products.find(p=>p.id===pid):null};
  const group=ph=>steps.filter(s=>s.phase===ph);

  const renderStep=(s,night=false)=>{
    const isDone=doneIds.includes(s.id);
    const prod=s.slot?getProd(s.slot):null;
    const fg=night?"rgba(240,237,230,.9)":"var(--ink)";
    const sub=night?"rgba(240,237,230,.45)":"var(--ink3)";
    return(
      <div key={s.id} style={{display:"flex",gap:14,padding:"16px 0",borderBottom:night?"none":`1px solid ${isDone?"transparent":"var(--border)"}`,opacity:isDone?.38:1,transition:"opacity .2s"}}>
        <button onClick={()=>dispatch({type:"toggle",dateKey,id:s.id})}
          style={{width:20,height:20,borderRadius:"50%",flexShrink:0,marginTop:3,cursor:"pointer",
            border:`1.5px solid ${isDone?(night?"rgba(240,237,230,.6)":th.stroke):"var(--border2)"}`,
            background:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {isDone&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2 4-4" stroke={night?"#f0ede6":th.stroke} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </button>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:16,lineHeight:1.3,textDecoration:isDone?"line-through":"none",color:fg,fontFamily:FP,fontWeight:400}}>
            {prod?prod.name:s.title}
          </p>
          {s.detail&&<p style={{marginTop:4,fontSize:12,lineHeight:1.5,color:sub}}>{s.detail}</p>}
          {prod?.notes&&<p style={{marginTop:3,fontSize:11,lineHeight:1.45,color:sub,fontStyle:"italic"}}>{prod.notes}</p>}
          <div style={{display:"flex",gap:8,marginTop:(s.minutes||s.slot)?9:0,flexWrap:"wrap",alignItems:"center"}}>
            {s.minutes&&<button onClick={()=>setTimer(s)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"5px 12px",borderRadius:40,border:`1px solid ${night?"rgba(240,237,230,.2)":"var(--border)"}`,background:"none",cursor:"pointer",fontSize:11,color:night?"rgba(240,237,230,.6)":"var(--ink3)"}}>⏱ {s.minutes} min</button>}
            {s.slot&&<button onClick={()=>setPicker({slot:s.slot,cat:SLOT_CAT[s.slot]})}
              style={{display:"inline-flex",alignItems:"center",gap:4,padding:"5px 12px",borderRadius:40,cursor:"pointer",fontSize:11,
                border:`1px solid ${prod?"rgba(74,124,89,.4)":"var(--border)"}`,
                background:prod?"rgba(74,124,89,.07)":"none",
                color:prod?"#3d6b4a":"var(--ink3)"}}>
              {prod?`trocar`:`escolher ${SLOT_CAT[s.slot].toLowerCase()}`}
            </button>}
          </div>
        </div>
      </div>
    );
  };

  return(
    <div style={{minHeight:"100dvh",background:"var(--bg)",fontFamily:FI,paddingBottom:"calc(170px + var(--sab))"}}
      onTouchStart={onTS} onTouchEnd={onTE}>
      <div style={{position:"sticky",top:0,zIndex:20,background:"rgba(240,237,230,.94)",backdropFilter:"blur(12px)",borderBottom:"1px solid var(--border)",
        paddingTop:"calc(var(--sat) + 10px)",paddingBottom:10,
        paddingLeft:"calc(var(--sal) + 16px)",paddingRight:"calc(var(--sar) + 16px)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink3)",fontSize:24,lineHeight:1,padding:"4px 0"}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>onNavDay(-1)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink3)",fontSize:24,lineHeight:1}}>‹</button>
            <span style={{fontSize:13,minWidth:128,textAlign:"center",color:"var(--ink)",fontWeight:500}}>{isToday?"Hoje":fromKey(dateKey).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}</span>
            <button onClick={()=>onNavDay(1)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink3)",fontSize:24,lineHeight:1}}>›</button>
          </div>
          <span style={{fontSize:11,color:"var(--ink3)",fontVariantNumeric:"tabular-nums",fontWeight:500,minWidth:32,textAlign:"right"}}>{done}/{steps.length}</span>
        </div>
      </div>
      <div style={{padding:"24px var(--px) 0",paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))"}}>
        <div style={{fontSize:10,letterSpacing:".22em",textTransform:"uppercase",color:"var(--ink3)",marginBottom:10,fontWeight:500}}>{focus==="reco"?"Semana de reconstrução":"Semana de hidratação"}</div>
        <h1 style={{fontFamily:FP,fontSize:"clamp(2rem,9vw,3rem)",lineHeight:.95,letterSpacing:"-.025em",color:"var(--ink)"}}>{th.label}</h1>
        <p style={{marginTop:8,fontSize:13,color:"var(--ink3)",lineHeight:1.55}}>{th.sub}</p>
        <div style={{marginTop:14,width:36,height:3,borderRadius:2,background:th.dot}}/>
      </div>
      {precolor&&<div style={{margin:"14px var(--px) 0",padding:"13px 16px",borderRadius:13,background:"#fdf6e3",border:"1px solid #e8d89a",fontSize:12,color:"#7a5c1e",lineHeight:1.55}}>
        ⚠ Amanhã é coloração. Ao final deste banho aplique o acidificante para remover depósito mineral.
      </div>}
      {type==="color"&&<div style={{margin:"14px var(--px) 0",padding:"13px 16px",borderRadius:13,background:"#fdf0f0",border:"1px solid #e8b8b8",fontSize:12,color:"#7a2020",lineHeight:1.55}}>
        Hoje é coloração — cabelo vai sujo. Oleosidade natural protege o couro cabeludo.
      </div>}
      <div style={{padding:"20px var(--px) 0",paddingLeft:"calc(var(--sal) + var(--px))",paddingRight:"calc(var(--sar) + var(--px))"}}>
        {["banho","pos"].map(ph=>group(ph).length?(
          <section key={ph} style={{marginBottom:24}}>
            <div style={{fontSize:10,letterSpacing:".2em",textTransform:"uppercase",color:"var(--ink3)",borderBottom:"1px solid var(--border)",paddingBottom:10,marginBottom:0,fontWeight:500}}>{ph==="banho"?"No banho":"Pós-banho"}</div>
            {group(ph).map(s=>renderStep(s))}
          </section>
        ):null)}
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:20,paddingLeft:"calc(var(--sal) + 16px)",paddingRight:"calc(var(--sar) + 16px)",paddingBottom:"calc(16px + var(--sab))"}}>
        <div style={{borderRadius:20,background:"#1e1b3a",padding:"15px 20px 18px",color:"rgba(240,237,230,.9)",boxShadow:"0 -8px 40px rgba(0,0,0,.18)"}}>
          <div style={{fontSize:10,letterSpacing:".2em",textTransform:"uppercase",opacity:.45,marginBottom:8,fontWeight:500}}>Ritual da noite</div>
          {group("noite").map(s=>renderStep(s,true))}
        </div>
      </div>
      <TimerSheet open={!!timer} title={timer?.title||""} minutes={timer?.minutes||1} type={type} onClose={()=>setTimer(null)}/>
      {picker&&<Picker open slot={picker.slot} cat={picker.cat} products={state.products} currentId={state.sel?.[picker.slot]||null}
        onSelect={(slot,pid)=>dispatch({type:"selProd",slot,pid})} onClose={()=>setPicker(null)}/>}
    </div>
  );
}

/* ── APP ── */
function App(){
  const[screen,setScreen]=useState("loading");
  const[state,setState]=useState(DEF);
  const[routineDate,setRoutineDate]=useState(todayKey());
  const[shelf,setShelf]=useState(false);

  useEffect(()=>{const s=load();setState(s);setScreen(s.profile?"home":"quiz")},[]);
  useEffect(()=>{if(screen!=="loading")save(state)},[state,screen]);

  const dispatch=useCallback(a=>{
    setState(s=>{
      if(a.type==="toggle"){const done=s.progress[a.dateKey]||[];const next=done.includes(a.id)?done.filter(i=>i!==a.id):[...done,a.id];return{...s,progress:{...s.progress,[a.dateKey]:next}}}
      if(a.type==="selProd"){const sel={...(s.sel||{})};if(a.pid)sel[a.slot]=a.pid;else delete sel[a.slot];return{...s,sel}}
      return s;
    });
  },[]);

  const washed=()=>setState(s=>({...s,anchor:todayKey(),skipped:(s.skipped||[]).filter(d=>d!==todayKey())}));
  const skip=()=>setState(s=>({...s,skipped:[...(s.skipped||[]).filter(d=>d!==todayKey()),todayKey()]}));
  const saveSettings=({anchor,colorDates})=>setState(s=>({...s,anchor,colorDates}));
  const saveShelf=products=>setState(s=>({...s,products}));
  const saveProfile=profile=>setState(s=>({...s,profile,anchor:s.anchor||todayKey()}));

  if(screen==="loading")return<div style={{minHeight:"100dvh",background:"var(--bg)"}}/>;
  if(screen==="quiz")return<Quiz onDone={p=>{saveProfile(p);setScreen("home")}}/>;
  if(screen==="settings")return<SettingsScreen state={state} onSave={saveSettings} onBack={()=>setScreen("home")} onResetQuiz={()=>setScreen("quiz")}/>;
  if(screen==="routine")return(
    <><Routine state={state} dispatch={dispatch} dateKey={routineDate} onBack={()=>setScreen("home")} onNavDay={dir=>setRoutineDate(d=>addDays(d,dir))}/><ShelfSheet open={shelf} onClose={()=>setShelf(false)} products={state.products} onSave={saveShelf}/></>
  );
  return(
    <><Home state={state} onRoutine={dk=>{setRoutineDate(dk||todayKey());setScreen("routine")}} onWashed={washed} onSkip={skip} onSettings={()=>setScreen("settings")} onShelf={()=>setShelf(true)}/><ShelfSheet open={shelf} onClose={()=>setShelf(false)} products={state.products} onSave={saveShelf}/></>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
